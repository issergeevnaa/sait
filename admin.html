<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — Киниро Суши Романовская</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Экран входа по паролю -->
    <div id="login-screen" class="login-overlay">
        <div class="login-box">
            <h2>🔒 Вход для персонала</h2>
            <p>Введите пароль администратора «Киниро Суши»</p>
            <form id="login-form">
                <input type="password" id="admin-password" placeholder="Пароль" required>
                <button type="submit" class="btn-primary">Войти в панель заказов</button>
            </form>
            <p id="login-error" class="error-text"></p>
        </div>
    </div>

    <!-- Основной интерфейс админки (скрыт до ввода пароля) -->
    <div id="admin-panel" style="display: none;">
        <header class="admin-header">
            <h1>📋 Киниро Суши — Панель заказов</h1>
            <p>Новые заказы появляются мгновенно</p>
            <div class="sound-controls">
                <button id="enable-sound-btn" class="btn-sound">🔔 Включить звук уведомлений</button>
                <button id="test-sound-btn" class="btn-sound-test" style="display: none;">🔊 Проверить звук</button>
            </div>
        </header>

        <main class="container">
            <div id="orders-list" class="orders-grid">
                <p>Загрузка заказов...</p>
            </div>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
