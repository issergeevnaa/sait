    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc } from "https://gstatic.com";

        const ADMIN_PASSWORD = "kiniro2026";

        const firebaseConfig = {
            apiKey: "AIzaSyBXEQJjxAKOZ3S43vTYBEvxfTf6ETnAShE",
            authDomain: "://firebaseapp.com",
            projectId: "kiniro-sushi",
            storageBucket: "kiniro-sushi.firebasestorage.app",
            messagingSenderId: "710609177306",
            appId: "1:710609177306:web:ae68ee60413d1f6f7733e3",
            measurementId: "G-QZFV0EF7JG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ordersList = document.getElementById("orders-list");
        const loginScreen = document.getElementById("login-screen");
        const adminPanel = document.getElementById("admin-panel");
        const loginForm = document.getElementById("login-form");
        const loginError = document.getElementById("login-error");
        const enableSoundBtn = document.getElementById("enable-sound-btn");
        const testSoundBtn = document.getElementById("test-sound-btn");

        let soundEnabled = false;
        let isInitialLoad = true;
        let knownOrderIds = new Set();

        function playNotificationSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();
                const now = ctx.currentTime;

                [0, 0.25].forEach((delay, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(idx === 0 ? 880 : 1174.66, now + delay);
                    gain.gain.setValueAtTime(0.35, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.35);
                });
            } catch (e) {
                console.error("Ошибка звука:", e);
            }
        }

        enableSoundBtn.addEventListener("click", () => {
            soundEnabled = true;
            playNotificationSound();
            enableSoundBtn.textContent = "🔔 Звук уведомлений активен";
            enableSoundBtn.classList.add("active");
            testSoundBtn.style.display = "inline-block";
        });

        testSoundBtn.addEventListener("click", () => {
            playNotificationSound();
        });

        function startAdminPanel() {
            loginScreen.style.display = "none";
            adminPanel.style.display = "block";

            const q = query(collection(db, "orders"), orderBy("timestamp", "desc"));

            onSnapshot(q, (snapshot) => {
                ordersList.innerHTML = "";
                let hasNewOrder = false;

                if (snapshot.empty) {
                    ordersList.innerHTML = "<p>Пока нет ни одного заказа.</p>";
                    isInitialLoad = false;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const order = docSnap.data();
                    const id = docSnap.id;

                    if (!knownOrderIds.has(id)) {
                        knownOrderIds.add(id);
                        if (!isInitialLoad && order.status === "Новый") {
                            hasNewOrder = true;
                        }
                    }

                    const isDone = order.status === "Выполнен";
                    const card = document.createElement("div");
                    card.className = `order-card ${isDone ? "completed" : ""}`;
                    card.innerHTML = `
                        <h3>Заказ от ${order.createdAt}</h3>
                        <p><strong>Статус:</strong> ${order.status}</p>
                        <p><strong>Клиент:</strong> ${order.name}</p>
                        <p><strong>Телефон:</strong> <a href="tel:${order.phone}">${order.phone}</a></p>
                        <p><strong>Адрес:</strong> ${order.address}</p>
                        <p><strong>Оплата:</strong> ${order.payment}</p>
                        <div class="order-items">
                            <strong>Состав заказа:</strong><br>
                            ${order.items.join("<br>")}
                        </div>
                        <p class="price">Итого: ${order.totalPrice} ₽</p>
                        ${!isDone ? `<button class="btn-done" onclick="markAsDone('${id}')">Отметить выполненным</button>` : ""}
                    `;
                    ordersList.appendChild(card);
});
if (hasNewOrder && soundEnabled) {
playNotificationSound();
}
isInitialLoad = false;
});
}
if (sessionStorage.getItem("kiniro_admin_auth") === "true") {

soundEnabled = true;
playNotificationSound();
enableSoundBtn.textContent = "🔔 Звук уведомлений активен";
enableSoundBtn.classList.add("active");
testSoundBtn.style.display = "inline-block";
startAdminPanel();
} else {
loginError.textContent = "Неверный пароль! Попробуйте еще раз.";
}
});
window.markAsDone = async (orderId) => {
const orderRef = doc(db, "orders", orderId);
await updateDoc(orderRef, { status: "Выполнен" });
};
