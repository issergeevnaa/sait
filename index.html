        body { background: #0f0f11; color: #f5f5f5; }

        header { background: linear-gradient(135deg, #18181b 0%, #09090b 100%); border-bottom: 2px solid #d4af37; text-align: center; padding: 26px 15px; }
        header h1 { font-size: 28px; color: #d4af37; letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase; }
        header p { color: #a1a1aa; font-size: 15px; }

        .controls-bar { max-width: 1250px; margin: 22px auto 0; padding: 0 15px; }
        #search-input { width: 100%; padding: 13px 16px; background: #18181b; border: 1px solid #3f3f46; color: #fff; border-radius: 10px; font-size: 15px; margin-bottom: 14px; outline: none; transition: 0.2s; }
        #search-input:focus { border-color: #d4af37; }
        #search-input::placeholder { color: #71717a; }

        .category-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
        .tab-btn { background: #18181b; border: 1px solid #3f3f46; padding: 9px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 600; color: #d4d4d8; transition: 0.2s; }
        .tab-btn:hover { border-color: #d4af37; color: #d4af37; }
        .tab-btn.active { background: linear-gradient(135deg, #d4af37, #aa8020); color: #09090b; border-color: #d4af37; }

        .container { max-width: 1250px; margin: 24px auto; padding: 0 15px; display: flex; gap: 22px; align-items: flex-start; }
        .menu-grid { flex: 2.3; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }

        .card { background: #18181b; border: 1px solid #27272a; padding: 16px; border-radius: 14px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
        .card:hover { border-color: #d4af37; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.12); }
        .card-img-placeholder { width: 100%; height: 110px; background: radial-gradient(circle, #27272a 0%, #121214 100%); border: 1px solid #2e2e32; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 42px; margin-bottom: 12px; }
        .card h3 { font-size: 16px; margin-bottom: 6px; line-height: 1.3; color: #fafafa; }
        .card-cat { font-size: 12px; color: #a1a1aa; margin-bottom: 12px; }
        .price { font-weight: bold; font-size: 18px; color: #f3ce5e; }

        button { cursor: pointer; border: none; padding: 11px 15px; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.2s; }
        .btn-add { background: transparent; border: 1px solid #d4af37; color: #d4af37; }
        .btn-add:hover { background: #d4af37; color: #09090b; }
        .btn-primary { background: linear-gradient(135deg, #e5c158, #b88c24); color: #09090b; font-size: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-primary:hover { filter: brightness(1.1); }

        .cart-box { flex: 1; min-width: 310px; background: #18181b; border: 1px solid #d4af37; padding: 20px; border-radius: 14px; box-shadow: 0 4px 25px rgba(0,0,0,0.5); position: sticky; top: 20px; }
        .cart-box h2 { color: #d4af37; font-size: 20px; border-bottom: 1px solid #27272a; padding-bottom: 10px; }
        #cart-items { list-style: none; margin: 15px 0; max-height: 300px; overflow-y: auto; }
        #cart-items li { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #27272a; font-size: 14px; gap: 8px; color: #e4e4e7; }
        .empty-cart { color: #71717a !important; justify-content: center !important; }
        .qty-controls { display: flex; align-items: center; gap: 6px; }
        .qty-btn { width: 26px; height: 26px; padding: 0; margin: 0; background: #27272a; color: #d4af37; border: 1px solid #3f3f46; border-radius: 6px; font-size: 15px; }
        .qty-btn:hover { background: #d4af37; color: #09090b; }
        .total { font-size: 19px; font-weight: bold; margin-bottom: 16px; text-align: right; color: #f3ce5e; }

        form input, form select { width: 100%; padding: 11px; margin-bottom: 10px; background: #0f0f11; border: 1px solid #3f3f46; color: #fff; border-radius: 8px; font-size: 14px; outline: none; }

rolls: { label: "Роллы", icon: "🍣" },
sets: { label: "Сеты", icon: "🍱" },
pizza: { label: "Пицца", icon: "🍕" },

};
let cart = [];
let currentCategory = "all";
let searchQuery = "";
const menuGrid = document.getElementById("menu-grid");
function renderMenu() {
menuGrid.innerHTML = "";
const filtered = menuData.filter(item => {
const matchCat = currentCategory === "all" || item.cat === currentCategory;
const matchSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase());
return matchCat && matchSearch;
});
if (filtered.length === 0) {
menuGrid.innerHTML = "Ничего не найдено. Попробуйте изменить запрос.";
return;
}
filtered.forEach(item => {
const catMeta = categoryInfo[item.cat];
const card = document.createElement("div");
card.className = "card";
card.innerHTML = <div> <div class="card-img-placeholder">${catMeta.icon}</div> <h3>${item.name}</h3> <div class="card-cat">${catMeta.label}</div> </div> <div> <div class="price">${item.price} ₽</div> <button class="btn-add" onclick="addToCart(${item.id})">В корзину</button> </div>;
menuGrid.appendChild(card);
});
}
document.querySelectorAll(".tab-btn").forEach(btn => {
btn.addEventListener("click", () => {
document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
btn.classList.add("active");
currentCategory = btn.dataset.cat;
renderMenu();
});
});
document.getElementById("search-input").addEventListener("input", (e) => {
searchQuery = e.target.value;
renderMenu();
});
window.addToCart = (id) => {
const existing = cart.find(c => c.id === id);
if (existing) {
existing.qty += 1;
} else {
const item = menuData.find(m => m.id === id);
cart.push({ id: item.id, name: item.name, price: item.price, qty: 1 });
}
renderCart();
};
window.changeQty = (id, delta) => {
const index = cart.findIndex(c => c.id === id);
if (index === -1) return;
cart[index].qty += delta;
if (cart[index].qty <= 0) {
cart.splice(index, 1);
}
renderCart();
};
function renderCart() {
const cartList = document.getElementById("cart-items");
const totalEl = document.getElementById("total-price");
cartList.innerHTML = "";
let total = 0;
if (cart.length === 0) {
cartList.innerHTML = <li class="empty-cart">Корзина пуста</li>;
totalEl.textContent = "0";
return;
}
cart.forEach(item => {
const sum = item.price * item.qty;
total += sum;
const li = document.createElement("li");
li.innerHTML = <span>${item.name} (${sum} ₽)</span> <div class="qty-controls"> <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button> <strong>${item.qty}</strong> <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button> </div>;
cartList.appendChild(li);
});
totalEl.textContent = total;
}
document.getElementById("order-form").addEventListener("submit", async (e) => {
e.preventDefault();
if (cart.length === 0) return alert("Добавьте хотя бы одну позицию в корзину!");
const orderData = {
name: document.getElementById("client-name").value,
phone: document.getElementById("client-phone").value,
address: document.getElementById("client-address").value,
payment: document.getElementById("payment-method").value,
items: cart.map(item => ${item.name} × ${item.qty} шт. (${item.price * item.qty} ₽)),

status: "Новый",
createdAt: new Date().toLocaleString("ru-RU"),
timestamp: Date.now()
};
try {
await addDoc(collection(db, "orders"), orderData);
alert("Заказ принят! Ожидайте звонка оператора «Киниро Суши».");

renderCart();
e.target.reset();
} catch (error) {

}
