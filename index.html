<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Киниро Суши Романовская — Доставка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🍣 Киниро Суши Романовская</h1>
        <p>Свежие роллы, пицца, вок и сеты с доставкой</p>
    </header>

    <div class="controls-bar">
        <input type="text" id="search-input" placeholder="🔍 Поиск по меню (например, Филадельфия или Пепперони)...">
        <div id="category-tabs" class="category-tabs">
            <button class="tab-btn active" data-cat="all">Все меню</button>
            <button class="tab-btn" data-cat="rolls">Роллы</button>
            <button class="tab-btn" data-cat="sets">Сеты</button>
            <button class="tab-btn" data-cat="pizza">Пицца</button>
            <button class="tab-btn" data-cat="wok">Вок и салаты</button>
            <button class="tab-btn" data-cat="snacks">Бургеры и закуски</button>
            <button class="tab-btn" data-cat="sauces">Соусы и добавки</button>
        </div>
    </div>

    <main class="container">
        <section id="menu-grid" class="menu-grid"></section>

        <aside class="cart-box">
            <h2>Ваш заказ</h2>
            <ul id="cart-items">
                <li class="empty-cart">Корзина пуста</li>
            </ul>
            <p class="total">Итого: <span id="total-price">0</span> ₽</p>

            <form id="order-form">
                <input type="text" id="client-name" placeholder="Ваше ФИО" required>
                <input type="tel" id="client-phone" placeholder="Контактный телефон" required>
                <input type="text" id="client-address" placeholder="Адрес доставки (улица, дом, кв.)" required>
                
                <select id="payment-method">
                    <option value="Наличные курьеру">Наличные курьеру</option>
                    <option value="Картой курьеру">Картой курьеру</option>
                    <option value="Перевод по СБП">Перевод по СБП</option>
                </select>

                <button type="submit" class="btn-primary">Оформить заказ</button>
            </form>
        </aside>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
